<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FixMe Hub CRM</title><style>body{margin:0;font-family:Arial;background:#f3f5f7;color:#17212b}header{background:#17212b;color:white;padding:14px 20px;display:flex;justify-content:space-between}nav{padding:10px;background:white;border-bottom:1px solid #ddd;display:flex;gap:6px;flex-wrap:wrap}button{padding:9px 13px;border:0;border-radius:7px;background:#1769aa;color:white;cursor:pointer}nav button{background:#e7edf2;color:#17212b}.wrap{max-width:1200px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:white;padding:16px;border-radius:10px;box-shadow:0 1px 4px #0001}.big{font-size:26px;font-weight:bold}form{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}input,select,textarea{padding:10px;border:1px solid #ccd3d9;border-radius:7px}textarea{min-height:60px}table{width:100%;border-collapse:collapse;background:white}td,th{padding:9px;border-bottom:1px solid #eee;text-align:left}.hidden{display:none}.login{max-width:390px;margin:12vh auto}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}form{grid-template-columns:1fr 1fr}}@media(max-width:450px){form{grid-template-columns:1fr}}</style></head><body><div id="login" class="login card"><h1>FixMe Hub CRM</h1><input id="un" value="admin" placeholder="Username"><br><br><input id="pw" type="password" placeholder="Password"><br><br><button onclick="login()">Login</button><p id="msg"></p></div><div id="app" class="hidden"><header><b>FixMe Hub CRM</b><span><span id="who"></span> <button onclick="logout()">Logout</button></span></header><nav><button onclick="show('dashboard')">Dashboard</button><button onclick="show('customers')">Customers</button><button onclick="show('jobs')">Repairs / Jobs</button><button onclick="show('inventory')">Inventory</button><button onclick="show('sales')">Sales</button><button onclick="show('expenses')">Expenses</button><button onclick="show('audit')">Audit</button></nav><main class="wrap"><section id="dashboard"><h2>Dashboard</h2><div class="grid"><div class="card">Today's Repairs<div class="big" id="r">0</div></div><div class="card">Today's Expenses<div class="big" id="e">0</div></div><div class="card">Today's Net Profit<div class="big" id="p">0</div></div><div class="card">Sales Profit<div class="big" id="sp">0</div></div></div></section><section id="customers" class="hidden"><h2>Customers</h2><form onsubmit="add(event,'customers')"><input name="name" required placeholder="Customer name"><input name="phone" placeholder="Phone"><input name="email" placeholder="Email"><input name="address" placeholder="Address"><textarea name="notes" placeholder="Notes"></textarea><button>Add Customer</button></form><div id="customers_t"></div></section><section id="jobs" class="hidden"><h2>Repair Jobs</h2><form onsubmit="add(event,'jobs')"><select id="cs" name="customer_id" required></select><input name="device" required placeholder="Device"><select name="repair_type"><option>Hardware Repair</option><option>Software Repair</option><option>Laptop Repair</option><option>Phone Repair</option></select><input name="description" placeholder="Problem / work"><select name="status"><option>Open</option><option>In Progress</option><option>Completed</option><option>Collected</option></select><input name="cost" type="number" step=".01" placeholder="Cost"><input name="price" type="number" step=".01" placeholder="Customer price"><button>Add Job</button></form><div id="jobs_t"></div></section><section id="inventory" class="hidden"><h2>Inventory</h2><form onsubmit="add(event,'inventory')"><input name="part" required placeholder="Part / item"><input name="supplier" placeholder="Supplier"><input name="quantity" type="number" placeholder="Quantity"><input name="reorder_level" type="number" placeholder="Reorder level"><input name="cost" type="number" step=".01" placeholder="Cost"><input name="selling_price" type="number" step=".01" placeholder="Selling price"><button>Add Item</button></form><div id="inventory_t"></div></section><section id="sales" class="hidden"><h2>Sales</h2><form onsubmit="add(event,'sales')"><input name="item" required placeholder="Item sold"><input name="quantity" type="number" value="1"><input name="cost" type="number" step=".01" placeholder="Cost"><input name="price" type="number" step=".01" placeholder="Selling price"><button>Record Sale</button></form><div id="sales_t"></div></section><section id="expenses" class="hidden"><h2>Expenses</h2><form onsubmit="add(event,'expenses')"><input name="category" required placeholder="Category"><input name="description" placeholder="Description"><input name="amount" required type="number" step=".01" placeholder="Amount"><button>Record Expense</button></form><div id="expenses_t"></div></section><section id="audit" class="hidden"><h2>Audit Log</h2><div id="audit_t"></div></section></main></div><script>let token=localStorage.fm_token;const $=x=>document.getElementById(x),money=n=>Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};let x=await fetch(u,o);if(x.status===401){logout();throw 0}return x.json()}async function login(){let x=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('un').value,password:$('pw').value})}),d=await x.json();if(!x.ok){$('msg').textContent=d.detail;return}token=d.token;localStorage.fm_token=token;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=d.username;show('dashboard')}function logout(){localStorage.removeItem('fm_token');location.reload()}function show(id){document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));$(id).classList.remove('hidden');load(id)}async function load(id){if(id==='dashboard'){let x=await api('/api/dashboard');$('r').textContent=x.repairs;$('e').textContent=money(x.expenses);$('p').textContent=money(x.net_profit);$('sp').textContent=money(x.sales_profit)}let m={customers:['/api/customers','customers_t'],jobs:['/api/jobs','jobs_t'],inventory:['/api/inventory','inventory_t'],sales:['/api/sales','sales_t'],expenses:['/api/expenses','expenses_t'],audit:['/api/audit','audit_t']}[id];if(m){let a=await api(m[0]);if(id==='jobs'){let c=await api('/api/customers');$('cs').innerHTML=c.map(x=>`<option value="${x.id}">${x.name} - ${x.phone}</option>`).join('')}$(m[1]).innerHTML=table(a)}}function table(a){if(!a.length)return '<p>No records yet.</p>';let k=Object.keys(a[0]);return '<div style="overflow:auto"><table><tr>'+k.map(x=>'<th>'+x.replaceAll('_',' ')+'</th>').join('')+'</tr>'+a.map(r=>'<tr>'+k.map(x=>'<td>'+(['cost','price','profit','amount'].includes(x)?money(r[x]):(r[x]??''))+'</td>').join('')+'</tr>').join('')+'</table></div>'}async function add(ev,type){ev.preventDefault();let o={};new FormData(ev.target).forEach((v,k)=>{o[k]=['customer_id','quantity','reorder_level'].includes(k)?Number(v):['cost','price','selling_price','amount'].includes(k)?Number(v):v});await api('/api/'+type,{method:'POST',body:JSON.stringify(o)});ev.target.reset();load(type);load('dashboard')}if(token){api('/api/dashboard').then(()=>{$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='Signed in';show('dashboard')}).catch(()=>{})}</script></body></html>
